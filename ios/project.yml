name: Shareblog
options:
  bundleIdPrefix: com.adrianthomas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  ShareblogKit:
    path: ShareblogKit

targets:
  Shareblog:
    type: application
    platform: iOS
    sources:
      - path: Shareblog
    dependencies:
      - package: ShareblogKit
      - target: ShareblogShareExtension
        embed: true
    info:
      path: Shareblog/Info.plist
      properties:
        CFBundleDisplayName: Shareblog
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Local dev only: the app talks to a plain-http localhost server.
        # Tighten or remove this before any real device / TestFlight build.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Shareblog/Shareblog.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.adrianthomas.shareblog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adrianthomas.shareblog
        PRODUCT_NAME: Shareblog
        TARGETED_DEVICE_FAMILY: "1,2"

  ShareblogShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareblogShareExtension
    dependencies:
      - package: ShareblogKit
    info:
      path: ShareblogShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Shareblog
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: ShareblogShareExtension/ShareblogShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.adrianthomas.shareblog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adrianthomas.shareblog.ShareExtension
        PRODUCT_NAME: ShareblogShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
